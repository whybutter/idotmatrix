upload_image:
  name: Upload image
  description: Upload an image to the panel. Any format Pillow can read; it is converted to RGB and resized to the panel size automatically.
  target:
    entity:
      domain: light
      integration: idotmatrix
  fields:
    file_path:
      name: File path
      description: Path to the image file in an HA-allowed directory (e.g. /config/www). Use this OR image_data.
      required: false
      selector:
        text:
    image_data:
      name: Image data (base64)
      description: Base64-encoded image bytes (used by the frontend card to upload a file from your PC). Advanced.
      required: false
      advanced: true
      selector:
        text:
    image_url:
      name: Image URL
      description: URL to fetch the image from (downloaded HA-side). Handy for album art (media_player entity_picture).
      required: false
      selector:
        text:
    size:
      name: Panel size
      description: Panel resolution (pixels per side).
      required: false
      default: 32
      selector:
        select:
          options:
            - "16"
            - "32"
            - "64"

upload_gif:
  name: Upload GIF
  description: Upload an animated GIF to the panel. Frames are resized to the panel size and re-encoded automatically.
  target:
    entity:
      domain: light
      integration: idotmatrix
  fields:
    file_path:
      name: File path
      description: Path to the GIF file in an HA-allowed directory (e.g. /config/www). Use this OR image_data.
      required: false
      selector:
        text:
    image_data:
      name: Image data (base64)
      description: Base64-encoded GIF bytes (used by the frontend card). Advanced.
      required: false
      advanced: true
      selector:
        text:
    image_url:
      name: Image URL
      description: URL to fetch the image from (downloaded HA-side). Handy for album art (media_player entity_picture).
      required: false
      selector:
        text:
    size:
      name: Panel size
      description: Panel resolution (pixels per side).
      required: false
      default: 32
      selector:
        select:
          options:
            - "16"
            - "32"
            - "64"

send_text:
  name: Send text
  description: Render and display a text message on the panel.
  target:
    entity:
      domain: light
      integration: idotmatrix
  fields:
    text:
      name: Text
      required: true
      selector:
        text:
    mode:
      name: Scroll / animation mode
      required: false
      default: marquee
      selector:
        select:
          options:
            - replace
            - marquee
            - reversed_marquee
            - rising
            - lowering
            - blinking
            - fading
            - tetris
            - filling
    speed:
      name: Speed
      description: 0-100 (higher is faster).
      required: false
      default: 95
      selector:
        number:
          min: 0
          max: 100
          mode: slider
    color_mode:
      name: Color mode
      required: false
      default: white
      selector:
        select:
          options:
            - white
            - rgb
            - rainbow_1
            - rainbow_2
            - rainbow_3
            - rainbow_4
    rgb_color:
      name: Text color
      description: Used when color mode is "rgb".
      required: false
      default: [255, 255, 255]
      selector:
        color_rgb:
    bg_color:
      name: Background color
      description: Omit for a black background.
      required: false
      selector:
        color_rgb:

mic_rhythm:
  name: Microphone rhythm
  description: Show the on-device microphone reactive visualizer (uses the panel's own mic). Re-send to change style or sensitivity live. Switch to another display (image, clock, off) to stop.
  target:
    entity:
      domain: light
      integration: idotmatrix
  fields:
    style:
      name: Style
      description: Visualizer style index (0 and up; valid range depends on the device).
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 20
          mode: box
    sensitivity:
      name: Sensitivity
      description: Mic sensitivity, 0-100.
      required: false
      default: 50
      selector:
        number:
          min: 0
          max: 100
          mode: slider

set_eco_mode:
  name: Set eco mode
  description: Configure the energy-saving auto-dim window (panel dims to a lower brightness between the start and end times).
  target:
    entity:
      domain: light
      integration: idotmatrix
  fields:
    enabled:
      name: Enabled
      required: true
      selector:
        boolean:
    start_time:
      name: Start time
      required: true
      selector:
        time:
    end_time:
      name: End time
      required: true
      selector:
        time:
    eco_brightness:
      name: Eco brightness
      description: Brightness (0-100) while inside the window.
      required: false
      default: 10
      selector:
        number:
          min: 0
          max: 100
          mode: slider

fullscreen_color:
  name: Fullscreen color
  description: Fill the whole panel with one solid color.
  target:
    entity:
      domain: light
      integration: idotmatrix
  fields:
    rgb_color:
      name: Color
      description: RGB color.
      required: true
      selector:
        color_rgb:

show_clock:
  name: Show clock
  description: Show the on-device clock.
  target:
    entity:
      domain: light
      integration: idotmatrix
  fields:
    style:
      name: Style
      required: false
      default: rgb_swipe_outline
      selector:
        select:
          options:
            - rgb_swipe_outline
            - christmas_tree
            - checkers
            - color
            - hourglass
            - alarm_clock
            - outlines
            - rgb_corners
    show_date:
      name: Show date
      required: false
      default: true
      selector:
        boolean:
    hour24:
      name: 24-hour format
      required: false
      default: true
      selector:
        boolean:
    rgb_color:
      name: Color
      required: false
      default: [255, 255, 255]
      selector:
        color_rgb:

show_effect:
  name: Show effect
  description: Show a built-in animated background.
  target:
    entity:
      domain: light
      integration: idotmatrix
  fields:
    style:
      name: Style
      required: false
      default: horizontal_rainbow
      selector:
        select:
          options:
            - horizontal_rainbow
            - random_colored_pixels
            - random_white_pixels
            - vertical_rainbow
            - diagonal_right_rainbow
            - diagonal_left_rainbow
            - random_colored_pixels_alt
    colors:
      name: Colors
      description: "Optional list of 2-7 RGB colors, e.g. [[255,0,0],[0,0,255]]. Defaults to a red/green/blue palette if omitted."
      required: false
      selector:
        object:
    speed:
      name: Speed
      description: Animation speed, 0-100.
      required: false
      default: 90
      selector:
        number:
          min: 0
          max: 100

chronograph:
  name: Chronograph
  description: Control the on-device stopwatch.
  target:
    entity:
      domain: light
      integration: idotmatrix
  fields:
    action:
      name: Action
      required: true
      selector:
        select:
          options: [reset, start, pause, resume]

countdown:
  name: Countdown
  description: Control the on-device countdown timer.
  target:
    entity:
      domain: light
      integration: idotmatrix
  fields:
    action:
      name: Action
      required: true
      selector:
        select:
          options: [stop, start, pause, restart]
    minutes:
      name: Minutes
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 59
          mode: box
    seconds:
      name: Seconds
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 59
          mode: box

scoreboard:
  name: Scoreboard
  description: Show two counters (0-999 each).
  target:
    entity:
      domain: light
      integration: idotmatrix
  fields:
    count1:
      name: Count 1
      required: true
      selector:
        number:
          min: 0
          max: 999
          mode: box
    count2:
      name: Count 2
      required: true
      selector:
        number:
          min: 0
          max: 999
          mode: box

show_album:
  name: Show album
  description: Switch the panel back to its stored on-device album (carousel) without re-uploading anything.
  target:
    entity:
      domain: light
      integration: idotmatrix

stop_rhythm:
  name: Stop rhythm
  description: Stop the audio rhythm visualizer.
  target:
    entity:
      domain: light
      integration: idotmatrix

draw_pixels:
  name: Draw pixels
  description: >-
    Live graffiti — draw individual pixels over whatever the panel currently
    shows, in order, appearing as a progressive stroke. Consecutive pixels of
    the same color are sent together, so single-color strokes render fast.
  target:
    entity:
      domain: light
      integration: idotmatrix
  fields:
    pixels:
      name: Pixels
      description: >-
        Ordered list of pixels. Each entry is [x, y, "#RRGGBB"] or
        [x, y, r, g, b], with x/y from 0 (top-left). Example:
        [[5, 5, "#ff0000"], [6, 5, "#ff0000"], [7, 6, "#00ff00"]]
      required: true
      selector:
        object:
    clear:
      name: Clear first
      description: Blank the panel to a black canvas before drawing.
      required: false
      default: false
      selector:
        boolean:
    chunk:
      name: Pixels per frame
      description: How many same-color pixels are painted at once. Lower values make the stroke visibly progressive.
      required: false
      default: 100
      selector:
        number:
          min: 1
          max: 100
    pace_ms:
      name: Frame delay (ms)
      description: Delay between frames. Higher values slow the drawing down into an animation.
      required: false
      default: 20
      selector:
        number:
          min: 5
          max: 500
