upload_image:
  name: Upload image
  description: Upload an image to the panel. Any format Pillow can read; it is converted to RGB and resized to the panel size automatically.
  target:
    entity:
      domain: light
      integration: idotmatrix
  fields:
    file_path:
      name: File path
      description: Path to the image file, must be in an HA-allowed directory (e.g. under /config/www).
      required: true
      selector:
        text:
    size:
      name: Panel size
      description: Panel resolution (pixels per side).
      required: false
      default: 32
      selector:
        select:
          options:
            - "16"
            - "32"
            - "64"

fullscreen_color:
  name: Fullscreen color
  description: Fill the whole panel with one solid color.
  target:
    entity:
      domain: light
      integration: idotmatrix
  fields:
    rgb_color:
      name: Color
      description: RGB color.
      required: true
      selector:
        color_rgb:

show_clock:
  name: Show clock
  description: Show the on-device clock.
  target:
    entity:
      domain: light
      integration: idotmatrix
  fields:
    style:
      name: Style
      description: "Clock style 0-7: 0 RGB-swipe outline, 1 Christmas tree, 2 checkers, 3 color, 4 hourglass, 5 alarm clock, 6 outlines, 7 RGB corners."
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 7
          mode: box
    show_date:
      name: Show date
      required: false
      default: true
      selector:
        boolean:
    hour24:
      name: 24-hour format
      required: false
      default: true
      selector:
        boolean:
    rgb_color:
      name: Color
      required: false
      default: [255, 255, 255]
      selector:
        color_rgb:

show_effect:
  name: Show effect
  description: Show a built-in animated background.
  target:
    entity:
      domain: light
      integration: idotmatrix
  fields:
    style:
      name: Style
      description: "Effect style 0-6: 0 horizontal rainbow, 1 random colored pixels, 2 random white pixels, 3 vertical rainbow, 4 diagonal-right rainbow, 5 diagonal-left rainbow, 6 random colored pixels."
      required: true
      selector:
        number:
          min: 0
          max: 6
          mode: box
    colors:
      name: Colors
      description: List of 2-7 RGB colors used by the effect.
      required: true
      selector:
        object:

chronograph:
  name: Chronograph
  description: Control the on-device stopwatch.
  target:
    entity:
      domain: light
      integration: idotmatrix
  fields:
    action:
      name: Action
      required: true
      selector:
        select:
          options: [reset, start, pause, resume]

countdown:
  name: Countdown
  description: Control the on-device countdown timer.
  target:
    entity:
      domain: light
      integration: idotmatrix
  fields:
    action:
      name: Action
      required: true
      selector:
        select:
          options: [stop, start, pause, restart]
    minutes:
      name: Minutes
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 59
          mode: box
    seconds:
      name: Seconds
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 59
          mode: box

scoreboard:
  name: Scoreboard
  description: Show two counters (0-999 each).
  target:
    entity:
      domain: light
      integration: idotmatrix
  fields:
    count1:
      name: Count 1
      required: true
      selector:
        number:
          min: 0
          max: 999
          mode: box
    count2:
      name: Count 2
      required: true
      selector:
        number:
          min: 0
          max: 999
          mode: box
